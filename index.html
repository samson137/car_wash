<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Fountain Car Wash &amp; Cleaning Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF3FA;--surf:#fff;--ink:#0B2545;--mut:#5E7391;--line:#D6E2F0;--acc:#1E90FF;--acc2:#1676D0;--m:#8B5CF6;--w:#F2A03D;--b:#12B5A0;--bad:#D9534F;--side:#0B2545;--sideink:#C9DAF0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08172B;--surf:#0F2440;--ink:#E5EFFB;--mut:#8EA6C4;--line:#1D3A5E;--side:#061224;--acc:#3AA0FF}}
:root[data-theme="dark"]{--bg:#08172B;--surf:#0F2440;--ink:#E5EFFB;--mut:#8EA6C4;--line:#1D3A5E;--side:#061224;--acc:#3AA0FF}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Instrument Sans',system-ui,sans-serif}
h1,h3,.v{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;letter-spacing:-.02em}
.app{display:grid;grid-template-columns:225px 1fr;min-height:100vh}
nav{background:var(--side);color:var(--sideink);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.logo{font:800 15px/1.15 'Bricolage Grotesque';color:#fff;padding:0 6px 16px;display:flex;align-items:center;gap:10px}
.logo img{width:54px;height:54px;border-radius:50%;background:#fff;flex:none}.logo small{display:block;font:500 12px 'Instrument Sans';opacity:.8;margin-top:2px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;font-weight:500}
nav button:hover{background:rgba(255,255,255,.08)}nav button.on{background:var(--acc);color:#fff}
nav .me{margin-top:auto;padding:10px;font-size:13px;opacity:.85}
main{padding:26px clamp(14px,3vw,38px);max-width:1200px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:29px;margin:0}.sub{color:var(--mut);margin:2px 0 0}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.grid .card{margin-bottom:0}.card h3{margin:0 0 12px;font-size:17px}
.stat .l{color:var(--mut);font-size:13px}.stat .v{font-weight:800;font-size:25px;margin-top:2px}.stat small{color:var(--mut)}.warn .v{color:var(--bad)}
.btn{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font:600 14px 'Instrument Sans';background:var(--acc);color:#fff}
.btn:hover{background:var(--acc2)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:6px 10px;font-size:13px}.btn.red{background:var(--bad)}.btn.wa{background:#1FA855}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.f{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.f .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{position:relative}.chip input{position:absolute;opacity:0}
.chip span{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:99px;cursor:pointer;background:var(--bg);color:var(--ink)}
.chip input:checked+span{background:var(--acc);color:#fff;border-color:var(--acc)}.chip input:focus-visible+span{outline:2px solid var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:13px;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}.scroll{overflow-x:auto}
.plate{font:700 13px 'Bricolage Grotesque';background:#F4D35E;color:#222;border-radius:6px;padding:2px 8px;border:2px solid #222;white-space:nowrap}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}.Paid{background:#D5F3EE;color:#0B6E64}.Debt,.Unpaid{background:#FADAD8;color:#9E2F2B}.Partial{background:#FCEBCB;color:#8A5A0A}.pill{background:#D5F3EE;color:#0B6E64;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line)}.split i{display:block}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:8px;color:var(--mut)}.key b{color:var(--ink)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.hint{background:rgba(30,144,255,.12);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}.hint.bad{background:rgba(217,83,79,.16)}
.vp td:last-child{text-align:right;font-weight:600}.vp tr.t td{border-top:2px solid var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit}.seg .on{background:var(--acc);color:#fff;border-color:var(--acc)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surf);color:var(--ink);padding:22px;width:min(480px,92vw)}dialog::backdrop{background:rgba(3,12,25,.6)}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:99}
.login{max-width:400px;margin:12vh auto;padding:28px}
@media(max-width:820px){.app{grid-template-columns:1fr}nav{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:10px;top:0;z-index:5}.logo,nav .me{display:none}nav button{white-space:nowrap}}
dialog{max-height:90vh;overflow:auto}
@media print{nav,.btn,.noprint,dialog{display:none!important}.app{display:block}body{background:#fff;color:#000}.card{border:0}}

function buildCat(){const R=[],add=(c,v,p,m,x)=>R.push(Object.assign({id:c+'|'+v+'|'+p,c,v,p,base:p,m},x||{}));
 [['Cars/Sedan',8000],['Station Wagon/Crossover',8000],['Small/Medium SUV/Jeep/Korope',9000],['Small/Medium SUV/Jeep/Korope',10000],['Large/Extra Large SUV/Bus',10000],['Large/Extra Large SUV/Bus',12000],['Coaster/Truck',17000]].forEach(([v,p])=>add('General Wash',v,p,500));

 const V5=['Cars','Small Jeep','Big Jeep','Cross Tour','Large Jeep'];
 [['Basic/Vac',[[2900,600],[3200,800],[3400,600],[3500,500],[3900,600]]],['Basic/Eng',[[4200,300],[4500,500],[4700,300],[4500,300],[5200,300]]],['Basic/Vac/Eng',[[5400,600],[5700,800],[5900,600],[6000,500],[6400,600]]],['Basic/Boot',[[2700,300],[3000,500],[3200,300],[3300,200],[3700,300]]],['Basic/Vac/Roof',[[4900,600],[5200,800],[5400,600],[5500,500],[5900,600]]],['Basic/Vac/Boot',[[3900,600],[4200,800],[4400,600],[4500,500],[4900,600]]],['Basic/Radiator',[[3400,600],[3700,800],[3900,600],[4000,500],[4400,600]]]] // special rule: Large Jeep radiator = 5,000

 `<p class="sub" style="margin:-4px 0 12px">${a===b?a:a+' to '+b}</p><div class="grid g4">${[['Vehicles washed',g.cars],['Customer payments (washes only)',N(g.total)],['Maintenance deductions',N(g.m)],['Staff commission',N(g.sc)],['Business share',N(g.bs)],['Cash',N(g.cash)],['Transfers',N(g.tr)],['POS',N(g.pos)],['Extra-care sales (100% company)',N(g.sales)],['Company income (business share + extra-care)',N(g.bs+g.sales)],['Debts (unpaid cars)',N(g.debt)],['Past debts collected',N(g.pdc)],['Daily expenses',N(g.ex)],['Staff loans',N(g.ln)],['Commission paid out',N(g.po)]].map(([l,x])=>stat(l,x)).join('')}</div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Split of collected money</h3>${bar(g.m,g.sc,g.bs)}</div><div class="card"><h3>Revenue by payment method</h3>${[['Cash',g.cash],['Transfer',g.tr],['POS',g.pos]].map(([k,x])=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${k}</span><b>${N(x)}</b></div>`).join('')}</div></div>
 <div class="card" style="margin-top:14px"><h3>Revenue by wash category</h3>${tbl(['Category','Cars','Payments','Maintenance','Staff','Business'],Object.entries(bc).map(([k,o])=>`<tr><td>${esc(k)}</td><td>${o.n}</td><td>${N(o.p)}</td><td>${N(o.m)}</td><td>${N(o.s)}</td><td>${N(o.b)}</td></tr>`))}</div>
 ${rp==='day'?(()=>{const e=agg(D,D);return`<div class="card"><h3>Cash reconciliation · ${D}</h3><table><tr><td>Cash from washes and debts</td><td>${N(e.cash)}</td></tr><tr><td>Cash from extra-care sales</td><td>${N(e.sCash)}</td></tr><tr><td>Less daily expenses</td><td>− ${N(e.ex)}</td></tr><tr><td>Less staff loans</td><td>− ${N(e.ln)}</td></tr><tr><td>Less commission paid out</td><td>− ${N(e.po)}</td></tr><tr><td><b>Cash that should be in hand</b></td><td><b>${N(e.expCash)}</b></td></tr></table>${cl?`<p>Closed by ${esc(cl.by)} on ${fd(cl.at)}. Counted <b>${N(cl.counted)}</b>. Difference: <b style="color:${Math.abs(cl.diff)<1?'var(--b)':'var(--bad)'}">${N(cl.diff)}</b>${cl.diff<0?' (short)':cl.diff>0?' (over)':''}.</p>${own()?'<button class="btn ghost sm" onclick="reopen()">Reopen day (owner PIN)</button>':''}`:`<div class="f" style="margin-top:12px"><div><label>Cash counted (₦)</label><input id="cc" type="number"></div><div style="align-self:end"><button class="btn" onclick="closeDay()">Close the day</button></div></div>`}</div>`})():''}`};
function closeDay(){if(v('cc')==='')return toast('Enter the cash counted');const e=agg(D,D);S.close.push({d:D,at:now(),by:U.name,expected:e.expCash,counted:+v('cc'),diff:+v('cc')-e.expCash});log(`closed ${D}: expected ${N(e.expCash)}, counted ${N(+v('cc'))}`);render()}
function reopen(){modal('Reopen day','<p class="sub" style="margin:0">Enter the owner PIN to reopen this day for corrections.</p><div><label>Owner PIN</label><input id="rp2" type="password" inputmode="numeric"></div>','Reopen',()=>{if(!S.users.some(u=>u.role==='owner'&&u.h===H(v('rp2')))){toast('Wrong PIN');return false}S.close=S.close.filter(x=>x.d!==D);log('REOPENED day '+D);render()})}
function buildPdf(){
 if(!window.jspdf){toast('The PDF tool did not load. Check your connection and try again.');return null}
 const doc=new window.jspdf.jsPDF(),g=agg(D,D),c=S.close.find(x=>x.d===D),M=n=>'NGN '+(Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});let y=18;
 const T=(t,b)=>{if(y>278){doc.addPage();y=18}doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(b?12:10);doc.text(String(t),14,y);y+=b?8:6},R=(a,b,bd)=>{if(y>278){doc.addPage();y=18}doc.setFont('helvetica',bd?'bold':'normal');doc.setFontSize(10);doc.text(String(a),14,y);doc.text(String(b),196,y,{align:'right'});y+=6};
 try{doc.addImage(LOGO,'JPEG',14,10,24,24)}catch(e){}doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('Fountain Car Wash & Cleaning Hub',42,19);doc.setFont('helvetica','normal');doc.setFontSize(11);doc.text('Daily Report - Restoring Freshness',42,27);y=42;
 T(new Date(D+'T00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(c?' - day closed':' - day NOT closed yet'));y+=2;
 T('Car wash',1);R('Vehicles washed',g.cars);R('Cash',M(g.cash));R('Transfers',M(g.tr));R('POS',M(g.pos));R('Total car wash payments',M(g.total),1);R('Past debts collected (included above)',M(g.pdc));R('Debts from today ('+g.debtN+' car(s))',M(g.debt));y+=2;
 T('Split of car wash payments',1);R('Maintenance',M(g.m));R('Staff commission',M(g.sc));R('Business share',M(g.bs));y+=2;
 T('Extra-care sales (100% company)',1);R('Total',M(g.sales),1);R('Cash / Transfer / POS',M(g.sCash)+' / '+M(g.sTr)+' / '+M(g.sPos));R('Company income (business share + extra-care)',M(g.bs+g.sales),1);y+=2;
 T('Expenses, power and loans',1);R('Light',S.power[D]||'not recorded');R('Daily expenses',M(g.ex));S.dx.filter(e=>ld(e.at)===D).forEach(e=>R('    '+e.desc,M(e.amt)));R('Staff loans',M(g.ln));y+=2;
 T('Staff commission for the day',1);S.staff.forEach(s=>{const e=crA(s.id,D,D),l=lnA(s.id,D,D);if(e||l)R(s.name+' (earned '+M(e)+', loan '+M(l)+')','Net '+M(e-l))});y+=2;
 T('Cash reconciliation',1);R('Cash from washes and debts',M(g.cash));R('Cash from extra-care sales',M(g.sCash));R('Less expenses, loans and commission paid out','-'+M(g.ex+g.ln+g.po));R('Cash that should be in hand',M(g.expCash),1);if(c){R('Cash counted',M(c.counted));R('Difference',M(c.diff),1)}y+=2;
 T('Transactions',1);g.T.slice().reverse().forEach(t=>R('#'+(t.no||'-')+'  '+(t.plate||'No plate')+'  '+t.cat+' / '+t.veh,M(t.charged)+(t.paid?'  '+t.paid.method:'  DEBT')));
 return doc.output('blob')}
async function pdfReport(){
 const blob=buildPdf();if(!blob)return;const file=new File([blob],'car-wash-report-'+D+'.pdf',{type:'application/pdf'});log('generated PDF report for '+D);
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Car wash report '+D});return}}catch(e){if(e&&e.name==='AbortError')return}
 const u=URL.createObjectURL(blob);window.open(u,'_blank');
 modal('PDF report ready','<p style="margin:0">The PDF opened in a new tab. WhatsApp cannot receive a file from a web page on this device, so: save the PDF from that tab, tap <b>Open WhatsApp</b>, then attach it with the paperclip. (On a phone, this button opens the share sheet where you can pick WhatsApp directly.)</p>','Open WhatsApp',()=>{window.open('https://wa.me/'+(S.waNum||'')+'?text='+encodeURIComponent('Daily car wash report for '+D+' (PDF attached)'),'_blank')})}
async function downloadPdf(){const blob=buildPdf();if(!blob)return;log('generated PDF report for '+D);
 let dl=null;try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
 if(dl){try{await dl.save({filename:'car-wash-report-'+D+'.pdf',data:blob});toast('Report saved');return}catch(e){if(e&&e.code==='declined')return}}
 window.open(URL.createObjectURL(blob),'_blank');toast('PDF opened in a new tab. Save it from there.')}
function wa(){const g=agg(D,D),c=S.close.find(x=>x.d===D);
 const t=[`*Fountain Car Wash & Cleaning Hub - daily report: ${D}*`,'',`Vehicles washed: ${g.cars}`,`Cash: ${N(g.cash)}`,`Transfers: ${N(g.tr)}`,`POS: ${N(g.pos)}`,`*Car wash payments: ${N(g.total)}*`,`(includes past debts paid ${N(g.pdc)})`,'',`*Extra-care sales (separate): ${N(g.sales)}*`,`Cash ${N(g.sCash)} · Transfer ${N(g.sTr)} · POS ${N(g.sPos)}`,'',`Debts today: ${N(g.debt)} (${g.debtN} car(s))`,`Daily expenses: ${N(g.ex)}`,`Power: ${S.power[D]||'not recorded'}`,`Staff loans: ${N(g.ln)}`,'',`Maintenance: ${N(g.m)}`,`Staff commission: ${N(g.sc)}`,`Business share: ${N(g.bs)}`,'',`Cash expected: ${N(g.expCash)}`,c?`Cash counted: ${N(c.counted)} (difference ${N(c.diff)})`:'Day not closed yet'].join('\n');
 try{navigator.clipboard.writeText(t)}catch(e){}log('sent WhatsApp report for '+D);window.open('https://wa.me/'+(S.waNum||'')+'?text='+encodeURIComponent(t),'_blank');toast('Report ready in WhatsApp')}
// ---------- Customers, maintenance, audit, settings ----------
V.cust=()=>{const m={};S.tx.forEach(t=>{const k=(t.customer||t.plate||'walk-in').toLowerCase(),c=m[k]=m[k]||{name:t.customer||t.plate||'Walk-in',k,plates:new Set(),l:[]};if(t.plate)c.plates.add(t.plate);c.l.push(t)});
 const q=flt.toLowerCase(),L=Object.values(m).filter(c=>!q||(c.name+[...c.plates].join(' ')).toLowerCase().includes(q));
 return head('Customer history','Grouped by customer name, or by plate when no name was given.')+`<div class="card"><input placeholder="Search name or plate" value="${esc(flt)}" oninput="srch(this.value)" style="margin-bottom:12px">${tbl(['Customer','Plates','Visits','Total paid','Owing','Last visit',''],L.map((c,i)=>`<tr><td><b>${esc(c.name)}</b></td><td>${[...c.plates].map(esc).join(', ')}</td><td>${c.l.length}</td><td>${N(sum(c.l.filter(t=>t.paid),t=>t.charged))}</td><td>${N(sum(c.l.filter(t=>!t.paid),t=>t.charged))}</td><td>${fd(c.l[0].at)}</td><td><button class="btn sm ghost" onclick="custH(${i})">History</button></td></tr>`))}</div>`.replace(/custH\((\d+)\)/g,(x,i)=>`custH(${JSON.stringify(Object.values(m).filter(c=>!q||(c.name+[...c.plates].join(' ')).toLowerCase().includes(q))[i].k).replace(/"/g,'&quot;')})`)};
function custH(k){const l=S.tx.filter(t=>(t.customer||t.plate||'walk-in').toLowerCase()===k);modal('Wash history',tbl(['Date','Service','Payment','Status'],l.map(t=>`<tr><td>${fd(t.at)}</td><td>${esc(t.cat)}<br><small>${esc(t.veh)} · ${esc(t.plate)}</small></td><td>${N(t.charged)}</td><td>${t.paid?t.paid.method:'<b>Debt</b>'}</td></tr>`)),'')}
V.maint=()=>{const i=maintIn(),o=maintOut();return head('Maintenance fund','The maintenance deduction from every paid transaction is set aside here.',own()?`<button class="btn" onclick="addM()">Record expense</button>`:'')+`<div class="grid g4" style="margin-bottom:14px">${stat('Set aside',N(i))}${stat('Spent',N(o))}${stat('Available',N(i-o))}</div><div class="card"><h3>Expenses</h3>${tbl(['Date','Reason','Amount'],S.exp.map(e=>`<tr><td>${fd(e.at)}</td><td>${esc(e.why)}</td><td>${N(e.amt)}</td></tr>`))}</div>`};
function addM(){modal('Maintenance expense','<div><label>What was it for?</label><input id="w"></div><div><label>Amount (₦)</label><input id="a" type="number"></div>','Save',()=>{const a=+v('a');if(!v('w')||!(a>0)||a>maintIn()-maintOut()){toast('Add a reason and an amount within the fund balance');return false}S.exp.unshift({at:now(),why:v('w'),amt:a});log(`maintenance expense ${N(a)}: ${v('w')}`);render()})}
V.audit=()=>head('Audit log','Who did what, and when. Includes every price change. Entries cannot be edited.')+`<div class="card">${tbl(['When','Who','Action'],S.log.map(l=>`<tr><td style="white-space:nowrap">${fd(l.at)}</td><td>${esc(l.who)} <small class="sub">${l.role}</small></td><td>${esc(l.a)}</td></tr>`))}</div>`;
V.set=()=>head('Settings','Owner only.')+`<div class="card"><h3>Extra-care products</h3>${tbl(['Product','Price (₦)'],Object.entries(S.prods).map(([n,p],i)=>`<tr><td>${esc(n)}</td><td style="width:140px"><input type="number" value="${p}" onchange="setP(${i},+this.value)"></td></tr>`))}<button class="btn ghost" style="margin-top:10px" onclick="addP()">Add product</button></div><div class="card"><h3>Owner WhatsApp number</h3><p class="sub" style="margin:0 0 10px">With country code, digits only (for example 2348012345678). Reports open straight to this chat.</p><input value="${esc(S.waNum||'')}" placeholder="234…" onchange="S.waNum=this.value.replace(/\\D/g,'');log('set owner WhatsApp number');save();toast('Saved')" style="max-width:260px"></div><div class="card"><h3>Test mode</h3><p class="sub" style="margin:0 0 10px">App date: <b>${today()}</b>${S.off?' (shifted)':' (real date)'}. Closing a day locks only that date, so a new day normally starts at midnight. While testing, move to the next day right away. New entries get the shifted date and every move is logged.</p><button class="btn" onclick="advDay()">Move app to next day</button> ${S.off?'<button class="btn ghost" onclick="realDay()">Back to real date</button>':''}</div><div class="card"><h3>Accounts</h3><table>${S.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${u.role}</td></tr>`).join('')}</table><button class="btn ghost" style="margin-top:10px" onclick="addU()">Add manager account</button></div>`;
function advDay(){S.off=(S.off||0)+864e5;D=today();log('TEST MODE: app date moved to '+today());render()}
function realDay(){S.off=0;D=today();log('TEST MODE: back to the real date');render()}
function setP(i,p){const n=Object.keys(S.prods)[i];if(p>0){S.prods[n]=p;log(`product price ${n} set to ${N(p)}`);render(1)}}
function addP(){modal('Add product','<div><label>Name</label><input id="n"></div><div><label>Price (₦)</label><input id="a" type="number"></div>','Add',()=>{if(!v('n')||!(+v('a')>0)){toast('Add a name and price');return false}S.prods[v('n')]=+v('a');log('added product '+v('n'));render()})}
function addU(){modal('Add manager','<div><label>Name</label><input id="n"></div><div><label>PIN (4 to 6 digits)</label><input id="p" type="password" inputmode="numeric"></div>','Add',()=>{if(!v('n')||!/^\d{4,6}$/.test(v('p'))){toast('Enter a name and a 4 to 6 digit PIN');return false}S.users.push({id:uid(),name:v('n'),role:'manager',h:H(v('p'))});log('added manager account '+v('n'));render()})}
setInterval(()=>{if(U&&own()&&view==='dash'&&!document.getElementById('dlg').open){S=load();render(1)}},5000);
render();
</script></body></html>
